<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculator</h1>

    <div class="main">
        <div class="result"><input type="text" id="display" value="0" readonly></div>
        <div class="btn">
            <button onclick="clearDisplay()" class="clr">AC</button>
            <button onclick="deleteLast()" class="clr"><i class="fa-solid fa-delete-left"></i></button>
            <button onclick="appendValue('%')" class="clr"><i class="fa-solid fa-percent"></i></button>
            <button onclick="appendValue('/')" class="clr"><i class="fa-solid fa-divide"></i></button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')" class="clr"><i class="fa-solid fa-xmark"></i></button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')" class="clr"><i class="fa-solid fa-minus"></i></button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')" class="clr"><i class="fa-solid fa-plus"></i></button>

            <button onclick="appendValue('00')">00</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')" class="dot">.</button>
            <button onclick="calculate()" id="equal"><i class="fa-solid fa-equals"></i></button>

            
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
